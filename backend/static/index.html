<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayrollFlow — Plataforma Automatizada de Nómina (SENA)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo & Brand -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-file-invoice-dollar text-xl text-white"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-blue-200">PayrollFlow</span>
          <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-900/60 text-blue-300 border border-blue-700/50">SENA Edition</span>
        </div>
      </div>

      <!-- Navigation Links (Contextual to role) -->
      <nav id="nav-links" class="hidden md:flex items-center space-x-1">
        <!-- Rendered by JS -->
      </nav>

      <!-- User Area / Auth Controls -->
      <div class="flex items-center space-x-3">
        <div id="user-pill" class="hidden items-center bg-slate-800 border border-slate-700 rounded-full py-1 px-3 space-x-2">
          <span id="user-role-badge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30">ROL</span>
          <span id="user-name" class="text-xs font-medium text-slate-200 max-w-[140px] truncate">Usuario</span>
          <button onclick="logout()" title="Cerrar Sesión" class="text-slate-400 hover:text-rose-400 text-xs ml-1 transition">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>

        <button id="btn-login-modal" onclick="openLoginModal()" class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold transition shadow-sm flex items-center space-x-1.5">
          <i class="fa-solid fa-user"></i>
          <span>Ingresar</span>
        </button>
      </div>

    </div>
  </header>


  <!-- ================= MAIN CONTENT CONTAINER ================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div id="content-container">
      <!-- Dynamic views loaded here based on active route and role -->
      <div class="flex items-center justify-center py-24">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-auto text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-slate-700">PayrollFlow</span>
        <span>— Proyecto Formativo SENA (85 Colaboradores · PostgreSQL 16 · FastAPI)</span>
      </div>
      <div class="flex items-center space-x-4">
        <a href="/docs" target="_blank" class="hover:text-blue-600 flex items-center space-x-1 transition">
          <i class="fa-solid fa-book-open"></i>
          <span>Documentación Swagger OpenAPI</span>
        </a>
        <span>·</span>
        <span class="text-slate-400">Reglas: RN-01 a RN-07 · CA-02 Validado</span>
      </div>
    </div>
  </footer>

  <!-- ================= LOGIN MODAL ================= -->
  <div id="modal-login" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 relative border border-slate-100">
      <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-3 shadow-inner">
          <i class="fa-solid fa-lock text-xl"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-800">Iniciar Sesión</h3>
        <p class="text-xs text-slate-500 mt-1">Ingresa con tus credenciales asignadas</p>
      </div>

      <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Correo Electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="login-email" required placeholder="ejemplo@empresa.test"
              class="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">
              <i class="fa-solid fa-key"></i>
            </span>
            <input type="password" id="login-password" required placeholder="••••••••"
              class="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          </div>
          <p class="text-[11px] text-slate-400 mt-1">Clave de desarrollo: <code class="bg-slate-100 px-1 py-0.5 rounded text-slate-600">Cambiar123*</code></p>
        </div>

        <div id="login-error" class="hidden text-xs text-rose-600 bg-rose-50 p-2.5 rounded-lg border border-rose-200"></div>

        <button type="submit" id="btn-login-submit" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition shadow-lg shadow-blue-500/25 flex items-center justify-center space-x-2">
          <span>Ingresar al Sistema</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= GENERIC ACTION MODAL ================= -->
  <div id="generic-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="generic-modal-content" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative border border-slate-100 max-h-[90vh] overflow-y-auto">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- ================= NOTIFICATION TOAST ================= -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden transition-all duration-300 transform translate-y-2">
    <div id="toast-inner" class="flex items-center space-x-3 px-4 py-3 rounded-xl shadow-xl text-sm font-medium">
      <i id="toast-icon" class="text-base"></i>
      <span id="toast-msg"></span>
    </div>
  </div>

  <!-- Application Logic JS -->
  <script src="/static/app.js?v=2.3.0"></script>
</body>
</html>
