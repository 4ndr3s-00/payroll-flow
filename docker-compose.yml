version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payroll_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payroll_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payroll_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: payroll_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=payroll_db
      - JWT_SECRET=super-secret-payroll-key-2026-sena-security-token
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
